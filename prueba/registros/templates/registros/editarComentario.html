{% extends "inicio/encabezado.html" %}
{% load static %}

{% block titulo %}Editar Comentario{% endblock %}
{% block info %}Editar Comentario{% endblock %}


{% block contenido %}

<div class="page-header">
    <div class="page-title">
        <h3>Editar Comentario</h3>
    </div>
</div>

<form class="form-horizontal" action="{% url 'Editar' comentario.id %}" method="POST" role="form">
    {% csrf_token %}

<div class="form-group">
    <label>Usuario</label>

    <input 
        value="{{ comentario.usuario }}" 
        name="usuario" 
        type="text" 
        class="form-control">
</div>

<div class="form-group">
    <label>Mensaje</label>

    <textarea 
        name="mensaje" 
        cols="50" 
        rows="10" 
        class="form-control">{{ comentario.mensaje }}</textarea>
</div>

<br>

<button type="submit" class="btn btn-success">
    Guardar cambios
</button>

<a href="{% url 'ConsultaComentarios' %}" class="btn btn-danger">
    Cancelar
</a>

</form>

{% endblock %}
